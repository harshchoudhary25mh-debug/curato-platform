[theme]
# Vibrant Coral for the Logo and Primary Action Buttons
primaryColor = "#FF6F61"

# Clean, warm Off-White for the main app canvas
backgroundColor = "#FDFBF7"

# Very pale, airy Teal wash for the sidebar and text input boxes
secondaryBackgroundColor = "#EDF2F2"

# Deep, rich Teal for the text (softer and more aesthetic than pure black)
textColor = "#0B4D46"
